<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เปลี่ยนรหัสผ่าน — zircon</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-subtle: #f4f4f5;
      --text: #18181b;
      --text-muted: #71717a;
      --border: #e4e4e7;
      --accent: #18181b;
      --accent-hover: #27272a;
      --danger: #dc2626;
      --success: #15803d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 14px;
      line-height: 1.6;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    header {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.04em;
      color: var(--text);
      text-decoration: none;
      user-select: none;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .change-box {
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 26px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 18px;
      font-weight: 300;
    }

    .account-pill {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12.5px;
      color: var(--text);
      margin-bottom: 14px;
      word-break: break-all;
      display: none;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-field {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .input-field:focus {
      border-color: var(--text);
    }

    .hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: -4px;
      line-height: 1.5;
    }

    .btn-dark {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-dark:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-dark:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 12px;
      font-size: 12px;
      display: none;
      line-height: 1.5;
    }

    .msg.error {
      display: block;
      color: var(--danger);
    }

    .msg.success {
      display: block;
      color: var(--success);
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      font-size: 12.5px;
      color: var(--text-muted);
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .footer-note {
      margin-top: 14px;
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      font-weight: 300;
    }

    @media (max-width: 480px) {
      .change-box {
        padding: 24px 18px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">zircon</a>
  </header>

  <main>
    <section class="change-box">
      <h1>เปลี่ยนรหัสผ่าน</h1>
      <p id="statusDesc" class="desc">กำลังตรวจสอบลิงก์สำหรับเปลี่ยนรหัสผ่าน...</p>

      <div id="accountEmailBox" class="account-pill mono"></div>

      <form id="changePasswordForm" onsubmit="handlePasswordChange(event)" style="display: none;">
        <input
          type="password"
          id="newPassword"
          class="input-field"
          placeholder="รหัสผ่านใหม่"
          autocomplete="new-password"
          minlength="8"
          required
        />
        <p class="hint">รหัสผ่านต้องมีตัวอักษรภาษาอังกฤษอย่างน้อย 1 ตัว และตัวเลขอย่างน้อย 1 ตัว รวมไม่น้อยกว่า 8 ตัว</p>
        <input
          type="password"
          id="confirmNewPassword"
          class="input-field"
          placeholder="ยืนยันรหัสผ่านใหม่อีกครั้ง"
          autocomplete="new-password"
          minlength="8"
          required
        />
        <button type="submit" id="btnSavePassword" class="btn-dark">ยืนยันการเปลี่ยนรหัสผ่าน</button>
      </form>

      <p id="messageBox" class="msg" role="alert"></p>
      <a href="index.html" class="back-link">กลับไปหน้าเข้าสู่ระบบ</a>
      <div class="footer-note">ใช้งานระบบฟรีได้ตลอด</div>
    </section>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCFycHVmpMs6F0eOuFssofoe6utBFVfhlM",
      authDomain: "zircon-3c94d.firebaseapp.com",
      projectId: "zircon-3c94d",
      storageBucket: "zircon-3c94d.firebasestorage.app",
      messagingSenderId: "638245118437",
      appId: "1:638245118437:web:5d5243377649512ea1cf0c",
      measurementId: "G-9Z0PH0CLB2"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode');
    const oobCode = params.get('oobCode');

    function setFeedbackMessage(text, isSuccess = false) {
      const el = document.getElementById('messageBox');
      if (!text) {
        el.textContent = '';
        el.className = 'msg';
        return;
      }
      el.textContent = text;
      el.className = `msg ${isSuccess ? 'success' : 'error'}`;
    }

    async function initChangePasswordPage() {
      const descEl = document.getElementById('statusDesc');
      const emailBox = document.getElementById('accountEmailBox');
      const formEl = document.getElementById('changePasswordForm');

      if (mode !== 'resetPassword' || !oobCode) {
        descEl.textContent = 'ลิงก์เปลี่ยนรหัสผ่านไม่ถูกต้องหรือไม่สมบูรณ์';
        setFeedbackMessage('กรุณาขอลิงก์รีเซ็ตรหัสผ่านใหม่อีกครั้งจากหน้าลืมรหัสผ่าน');
        return;
      }

      try {
        const email = await auth.verifyPasswordResetCode(oobCode);
        descEl.textContent = 'กรอกรหัสผ่านใหม่ที่ต้องการใช้งาน';
        emailBox.textContent = `บัญชี: ${email}`;
        emailBox.style.display = 'block';
        formEl.style.display = 'flex';
        document.getElementById('newPassword').focus();
      } catch (error) {
        descEl.textContent = 'ไม่สามารถใช้ลิงก์นี้ได้';
        setFeedbackMessage('ลิงก์เปลี่ยนรหัสผ่านไม่ถูกต้อง หมดอายุ หรือถูกใช้งานไปแล้ว กรุณาขอใหม่อีกครั้ง');
      }
    }

    async function handlePasswordChange(event) {
      event.preventDefault();
      setFeedbackMessage('');

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmNewPassword').value;
      const btn = document.getElementById('btnSavePassword');

      if (!/[A-Za-z]/.test(newPassword) || !/[0-9]/.test(newPassword) || newPassword.length < 8) {
        setFeedbackMessage('รหัสผ่านต้องมีตัวอักษรภาษาอังกฤษอย่างน้อย 1 ตัว และตัวเลขอย่างน้อย 1 ตัว รวมอย่างน้อย 8 ตัว');
        return;
      }

      if (newPassword !== confirmPassword) {
        setFeedbackMessage('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
        return;
      }

      btn.disabled = true;
      try {
        await auth.confirmPasswordReset(oobCode, newPassword);
        document.getElementById('changePasswordForm').style.display = 'none';
        document.getElementById('statusDesc').textContent = 'เปลี่ยนรหัสผ่านเรียบร้อยแล้ว';
        setFeedbackMessage('เปลี่ยนรหัสผ่านใหม่สำเร็จ สามารถกลับไปเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้ทันที', true);
      } catch (error) {
        const code = error && error.code;
        if (code === 'auth/weak-password') {
          setFeedbackMessage('รหัสผ่านไม่ปลอดภัยพอ กรุณาตั้งรหัสผ่านใหม่ที่คาดเดาได้ยากขึ้น');
        } else if (code === 'auth/expired-action-code' || code === 'auth/invalid-action-code') {
          setFeedbackMessage('ลิงก์นี้หมดอายุหรือถูกใช้งานไปแล้ว กรุณาขอลิงก์รีเซ็ตรหัสผ่านใหม่');
        } else {
          setFeedbackMessage('เกิดข้อผิดพลาดในการเปลี่ยนรหัสผ่าน กรุณาลองใหม่อีกครั้ง');
        }
      } finally {
        btn.disabled = false;
      }
    }

    initChangePasswordPage();
  </script>
</body>
</html>
